# สัญญา API ของ K Sure — เขียนตาม docs/05-api.md (เพิ่ม endpoint ทีละ Phase)
openapi: 3.1.0
info:
  title: K Sure API (Prototype)
  version: 0.1.0
  description: |
    เงินเป็น integer สตางค์ · เวลาเป็น ISO-8601 มี offset · ทุก response ส่ง header X-Request-ID กลับ
servers:
  - url: http://localhost:8080/api/v1
security:
  - session: []
paths:
  /healthz:
    get:
      summary: process ยังทำงาน (ไม่แตะ DB)
      operationId: healthz
      tags: [health]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: ok }
  /readyz:
    get:
      summary: ต่อฐานข้อมูลได้
      operationId: readyz
      tags: [health]
      security: []
      responses:
        "200":
          description: พร้อมรับ request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: ready }
        "503":
          description: ต่อ DB ไม่ได้ (code = NOT_READY)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/demo-login:
    post:
      summary: ล็อกอินด้วยบัญชีเดโม (ไม่มีรหัสผ่าน) → cookie ks_session
      operationId: demoLogin
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, enum: [landlord, tenant] }
      responses:
        "200":
          description: สำเร็จ — Set-Cookie ks_session (HttpOnly, SameSite=Lax)
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: ลบ cookie ks_session
      operationId: logout
      tags: [auth]
      security: []
      responses:
        "204": { description: ลบแล้ว }
  /me:
    get:
      summary: ผู้ใช้ + บัญชีหลัก + จำนวนแจ้งเตือนที่ยังไม่อ่าน
      operationId: getMe
      tags: [user]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
  /home:
    get:
      summary: ข้อมูลหน้าหลัก L1 / T1 ในครั้งเดียว
      operationId: getHome
      tags: [user]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        "401": { $ref: "#/components/responses/Error" }
  /properties:
    get:
      summary: ห้องของผู้ให้เช่า (LANDLORD เท่านั้น)
      operationId: listProperties
      tags: [user]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Property" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /notifications:
    get:
      summary: แจ้งเตือนล่าสุด 50 รายการ
      operationId: listNotifications
      tags: [notifications]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  unreadCount: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
  /notifications/read:
    post:
      summary: ทำเครื่องหมายว่าอ่านแล้ว (ระบุ ids หรือ all = true)
      operationId: markNotificationsRead
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
                all: { type: boolean }
      responses:
        "200":
          description: จำนวนที่ยังไม่อ่านหลังอัปเดต
          content:
            application/json:
              schema:
                type: object
                required: [unreadCount]
                properties:
                  unreadCount: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /deals:
    get:
      summary: ดีลของฉัน
      operationId: listDeals
      tags: [deals]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, closed] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DealSummary" } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: สร้างดีล → WAITING_ACCEPT + คำเชิญ QR (LANDLORD)
      operationId: createDeal
      tags: [deals]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [propertyId, totalSatang, bookingFeeSatang, viewingAt, moveInDate]
              properties:
                propertyId: { type: string, format: uuid }
                totalSatang: { type: integer, format: int64, minimum: 1, maximum: 100000000 }
                bookingFeeSatang: { type: integer, format: int64, description: "0 < booking < total" }
                viewingAt: { type: string, format: date-time, description: ต้องอยู่ในอนาคต }
                moveInDate: { type: string, format: date, description: ไม่ก่อนวันดูห้อง (เวลาไทย) }
      responses:
        "201": { $ref: "#/components/responses/Deal" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /deals/{id}:
    parameters: [{ $ref: "#/components/parameters/DealID" }]
    get:
      summary: ดีล + ไทม์ไลน์ + งวดเงิน — คู่ดีล หรือผู้เช่าที่มีคำเชิญที่ยังใช้ได้ (preview ไม่มีข้อมูลผู้เช่า)
      operationId: getDeal
      tags: [deals]
      responses:
        "200": { $ref: "#/components/responses/Deal" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /deals/{id}/invite:
    parameters: [{ $ref: "#/components/parameters/DealID" }]
    post:
      summary: ออก QR ใหม่ (อันเก่าใช้ไม่ได้) — LANDLORD
      operationId: reissueInvite
      tags: [deals]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { $ref: "#/components/responses/Deal" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /deals/{id}/invite/send:
    parameters: [{ $ref: "#/components/parameters/DealID" }]
    post:
      summary: ส่งคำขอเข้าแอปผู้เช่า (IN_APP) หรือตามเบอร์ (PHONE) — LANDLORD
      operationId: sendInvite
      tags: [deals]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channel: { type: string, enum: [IN_APP, PHONE], default: IN_APP }
                phone: { type: string, example: "0890001432" }
      responses:
        "200":
          description: ส่งแล้ว
          content:
            application/json:
              schema:
                type: object
                required: [sentTo, sentAt]
                properties:
                  sentTo: { type: object, required: [shortName], properties: { shortName: { type: string } } }
                  sentAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /deals/{id}/reject:
    parameters: [{ $ref: "#/components/parameters/DealID" }]
    post:
      summary: ปฏิเสธดีล WAITING_ACCEPT → REJECTED (TENANT)
      operationId: rejectDeal
      tags: [deal actions]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Version" }
      responses:
        "200": { $ref: "#/components/responses/Deal" }
        "409": { $ref: "#/components/responses/Error" }
  /deals/{id}/lock:
    parameters: [{ $ref: "#/components/parameters/DealID" }]
    post:
      summary: ยอมรับ + กันเงิน WAITING_ACCEPT → FUNDS_LOCKED (TENANT)
      operationId: lockDeal
      tags: [deal actions]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, inviteCode, method]
              properties:
                version: { type: integer }
                inviteCode: { type: string, description: share code หรือ token จาก QR ของดีลนี้ }
                method: { type: string, enum: [FACE_ID, PIN], description: เก็บเป็นข้อมูลประกอบเท่านั้น ไม่มีค่า PIN }
      responses:
        "200": { $ref: "#/components/responses/Deal" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /deals/{id}/confirm-viewing:
    parameters: [{ $ref: "#/components/parameters/DealID" }]
    post:
      summary: ยืนยันดูห้อง → ปล่อยค่าจอง (FUNDS_LOCKED → BOOKING_FEE_RELEASED)
      operationId: confirmViewing
      tags: [deal actions]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, checklist]
              properties:
                version: { type: integer }
                checklist:
                  type: array
                  description: ต้องครบทั้ง 3 ข้อ
                  items: { type: string, enum: [VIEWED_ROOM, ROOM_MATCHES, LANDLORD_MATCHES] }
      responses:
        "200": { $ref: "#/components/responses/Deal" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /deals/{id}/confirm-move-in:
    parameters: [{ $ref: "#/components/parameters/DealID" }]
    post:
      summary: ยืนยันเข้าอยู่ → ปล่อยมัดจำหลัก (BOOKING_FEE_RELEASED → RELEASED)
      operationId: confirmMoveIn
      tags: [deal actions]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, checklist]
              properties:
                version: { type: integer }
                checklist:
                  type: array
                  items: { type: string, enum: [GOT_KEYS, ROOM_USABLE, CONTRACT_SIGNED] }
      responses:
        "200": { $ref: "#/components/responses/Deal" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /invites/{code}:
    get:
      summary: ผู้เช่าดูดีลจาก share code หรือ token (T2) — จำกัด 30 ครั้ง/นาที
      operationId: previewInvite
      tags: [deals]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: KS-8F4Q21 }
      responses:
        "200": { $ref: "#/components/responses/Deal" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /users/lookup:
    get:
      summary: หาผู้เช่าจากเบอร์มือถือ (คืนแค่ชื่อย่อ) — LANDLORD
      operationId: lookupUser
      tags: [deals]
      parameters:
        - { name: phone, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [shortName], properties: { shortName: { type: string } } }
        "404": { $ref: "#/components/responses/Error" }
  /transfers/payees:
    get:
      summary: ผู้รับโอนที่เลือกได้ (บัญชีหลักของผู้ใช้เดโมคนอื่น)
      operationId: listPayees
      tags: [transfers]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [accountId, displayName, bankName, accountNoMasked]
                      properties:
                        accountId: { type: string, format: uuid }
                        displayName: { type: string }
                        bankName: { type: string }
                        accountNoMasked: { type: string }
  /transfers/precheck:
    post:
      summary: ตรวจว่ากำลังโอนหาคู่ดีลที่ยังไม่จบไหม (T8)
      operationId: precheckTransfer
      tags: [transfers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toAccountId]
              properties:
                toAccountId: { type: string, format: uuid }
                amountSatang: { type: integer, format: int64 }
      responses:
        "200":
          description: warning = null คือโอนได้ตามปกติ
          content:
            application/json:
              schema:
                type: object
                required: [warning]
                properties:
                  warning:
                    oneOf:
                      - type: object
                        required: [code, dealId, unitNo, message]
                        properties:
                          code: { type: string, enum: [OFF_DEAL_PAYMENT] }
                          dealId: { type: string, format: uuid }
                          unitNo: { type: string }
                          message: { type: string }
                      - type: "null"
  /transfers:
    post:
      summary: โอนจำลอง (CONFIRM) หรือบันทึกว่ายกเลิกหลังเห็นคำเตือน (CANCEL)
      operationId: createTransfer
      tags: [transfers]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toAccountId, amountSatang, action]
              properties:
                toAccountId: { type: string, format: uuid }
                amountSatang: { type: integer, format: int64, minimum: 1 }
                memo: { type: string, maxLength: 100 }
                action: { type: string, enum: [CONFIRM, CANCEL] }
      responses:
        "201":
          description: บันทึกแล้ว — warningShown คำนวณที่ server
          content:
            application/json:
              schema:
                type: object
                required: [id, status, warningShown]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [COMPLETED_SIMULATED, CANCELLED_BY_USER] }
                  warningShown: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /deals/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/DealID" }]
    post:
      summary: ขอยกเลิก (ฝ่ายแรก) / ยินยอมยกเลิก (ฝ่ายที่สอง → REFUNDED คืนยอดที่ยังไม่ปล่อย)
      operationId: cancelDeal
      tags: [deal actions]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Version" }
      responses:
        "200": { $ref: "#/components/responses/Deal" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /deals/{id}/report-issue:
    parameters: [{ $ref: "#/components/parameters/DealID" }]
    post:
      summary: แจ้งห้องไม่ตรงกับดีล (TENANT · FUNDS_LOCKED) → hasOpenIssue · เงินยังกันไว้
      operationId: reportIssue
      tags: [deal actions]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Version" }
      responses:
        "200": { $ref: "#/components/responses/Deal" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /deals/{id}/calendar.ics:
    parameters: [{ $ref: "#/components/parameters/DealID" }]
    get:
      summary: ไฟล์ปฏิทิน (นัดดูห้อง + วันเข้าอยู่)
      operationId: dealCalendar
      tags: [deals]
      responses:
        "200":
          description: text/calendar (RFC 5545)
          content:
            text/calendar:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Error" }
  /demo/deals/{id}/expire-now:
    parameters: [{ $ref: "#/components/parameters/DealID" }]
    post:
      summary: ให้ดีล active หมดอายุทันที (Demo tools) — มีเงินกัน → คืนอัตโนมัติ
      operationId: demoExpireNow
      tags: [demo]
      responses:
        "200": { $ref: "#/components/responses/Deal" }
        "409": { $ref: "#/components/responses/Error" }
  /demo/reset:
    post:
      summary: รีเซ็ตข้อมูลเดโมตาม scenario (มีเมื่อ DEMO_TOOLS_ENABLED=true)
      operationId: demoReset
      tags: [demo]
      parameters:
        - name: scenario
          in: query
          schema:
            type: string
            enum: [fresh, waiting_accept, funds_locked, booking_released, released]
            default: fresh
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [scenario, dealId]
                properties:
                  scenario: { type: string }
                  dealId: { type: [string, "null"], format: uuid }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ks_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID ต่อการกดหนึ่งครั้ง — ส่งซ้ำ key เดิมได้คำตอบเดิม (header Idempotent-Replayed true)
      schema: { type: string, maxLength: 255 }
    DealID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    Version:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [version]
            properties:
              version: { type: integer }
  responses:
    Deal:
      description: DealDTO
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Deal" }
    Error:
      description: error (ดู code)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  headers:
    XRequestID:
      description: รหัสอ้างอิง request — ส่งมาเองได้ ถ้าไม่ส่ง server สร้างให้
      schema: { type: string }
  schemas:
    User:
      type: object
      required: [id, role, displayName, shortName]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [LANDLORD, TENANT] }
        displayName: { type: string, example: สมชาย ใจดี }
        shortName: { type: string, example: สมชาย ใ. }
    Account:
      type: object
      required: [id, bankName, accountType, accountNoMasked, balanceSatang, heldSatang, availableSatang]
      properties:
        id: { type: string, format: uuid }
        bankName: { type: string }
        accountType: { type: string }
        accountNoMasked: { type: string, example: xxx-x-x4821 }
        balanceSatang: { type: integer, format: int64 }
        heldSatang: { type: integer, format: int64 }
        availableSatang: { type: integer, format: int64, description: balance − held }
    Me:
      type: object
      required: [user, account, unreadNotifications]
      properties:
        user: { $ref: "#/components/schemas/User" }
        account: { $ref: "#/components/schemas/Account" }
        unreadNotifications: { type: integer }
    Home:
      type: object
      required: [me, pendingInvites, activeDeals]
      properties:
        me: { $ref: "#/components/schemas/Me" }
        pendingInvites:
          type: array
          items:
            type: object
            required: [dealId, fromShortName, sentAt, projectName, unitNo, viewingAt, totalSatang, shareCode]
            properties:
              dealId: { type: string, format: uuid }
              fromShortName: { type: string }
              sentAt: { type: string, format: date-time }
              projectName: { type: string }
              unitNo: { type: string }
              viewingAt: { type: string, format: date-time }
              totalSatang: { type: integer, format: int64 }
              shareCode: { type: string, example: KS-8F4Q21 }
        activeDeals:
          type: array
          items:
            type: object
            required: [dealId, state, projectName, unitNo, totalSatang]
            properties:
              dealId: { type: string, format: uuid }
              state: { type: string, enum: [WAITING_ACCEPT, FUNDS_LOCKED, BOOKING_FEE_RELEASED] }
              projectName: { type: string }
              unitNo: { type: string }
              totalSatang: { type: integer, format: int64 }
    Property:
      type: object
      required: [id, propertyType, projectName, unitNo, detailLabel, nearbyLabel]
      properties:
        id: { type: string, format: uuid }
        propertyType: { type: string }
        projectName: { type: string }
        unitNo: { type: string }
        detailLabel: { type: string }
        nearbyLabel: { type: string }
    Notification:
      type: object
      required: [id, type, dealId, title, body, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [DEAL_INVITE, FUNDS_LOCKED, BOOKING_FEE_RELEASED, MAIN_DEPOSIT_RELEASED, DEAL_REJECTED,
                 CANCEL_REQUESTED, DEAL_REFUNDED, DEAL_EXPIRED]
        dealId: { type: [string, "null"], format: uuid }
        title: { type: string }
        body: { type: string }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    Party:
      type: object
      required: [displayName, shortName, accountNoMasked]
      properties:
        displayName: { type: string }
        shortName: { type: string }
        bankName: { type: string }
        accountNoMasked: { type: string }
        nameVerified: { type: boolean }
    DealState:
      type: string
      enum: [WAITING_ACCEPT, REJECTED, FUNDS_LOCKED, BOOKING_FEE_RELEASED, RELEASED, EXPIRED, REFUNDED]
    Deal:
      type: object
      description: docs/05-api.md §3 DealDTO
      required: [id, refNo, shareCode, state, version, dealType, property, landlord, tenant, amounts, tranches,
                 viewingAt, moveInDate, expiresAt, invite, cancel, hasOpenIssue, myRole, nextActor, allowedActions,
                 timeline, createdAt]
      properties:
        id: { type: string, format: uuid }
        refNo: { type: string, example: KS-691014-0458 }
        shareCode: { type: string, example: KS-8F4Q21 }
        state: { $ref: "#/components/schemas/DealState" }
        version: { type: integer }
        dealType: { type: string, enum: [RENTAL_DEPOSIT] }
        property: { $ref: "#/components/schemas/Property" }
        landlord: { $ref: "#/components/schemas/Party" }
        tenant:
          oneOf: [{ $ref: "#/components/schemas/Party" }, { type: "null" }]
        amounts:
          type: object
          required: [totalSatang, bookingFeeSatang, mainDepositSatang, feeSatang, releasedSatang, heldSatang, refundedSatang]
          properties:
            totalSatang: { type: integer, format: int64 }
            bookingFeeSatang: { type: integer, format: int64 }
            mainDepositSatang: { type: integer, format: int64 }
            feeSatang: { type: integer, format: int64 }
            releasedSatang: { type: integer, format: int64 }
            heldSatang: { type: integer, format: int64 }
            refundedSatang: { type: integer, format: int64 }
        tranches:
          type: array
          items:
            type: object
            required: [key, amountSatang, status, releasedAt]
            properties:
              key: { type: string, enum: [BOOKING_FEE, MAIN_DEPOSIT] }
              amountSatang: { type: integer, format: int64 }
              status: { type: string, enum: [PENDING, HELD, RELEASED, REFUNDED] }
              releasedAt: { type: [string, "null"], format: date-time }
        viewingAt: { type: string, format: date-time }
        moveInDate: { type: string, format: date }
        expiresAt: { type: string, format: date-time }
        invite:
          oneOf:
            - type: object
              required: [expiresAt, sentAt]
              properties:
                expiresAt: { type: string, format: date-time }
                qrUrl: { type: string, description: เฉพาะตอนสร้าง/ออกใหม่ }
                sentAt: { type: [string, "null"], format: date-time }
            - type: "null"
        cancel:
          type: object
          required: [landlordRequestedAt, tenantRequestedAt]
          properties:
            landlordRequestedAt: { type: [string, "null"], format: date-time }
            tenantRequestedAt: { type: [string, "null"], format: date-time }
        hasOpenIssue: { type: boolean }
        myRole: { type: string, enum: [LANDLORD, TENANT] }
        nextActor: { type: [string, "null"], enum: [TENANT, null] }
        allowedActions:
          type: array
          items: { type: string, enum: [REJECT, LOCK, CONFIRM_VIEWING, CONFIRM_MOVE_IN, CANCEL, REPORT_ISSUE] }
        timeline:
          type: array
          items:
            type: object
            required: [type, at, amountSatang]
            properties:
              type: { type: string }
              at: { type: string, format: date-time }
              amountSatang: { type: [integer, "null"], format: int64 }
        createdAt: { type: string, format: date-time }
        account:
          type: object
          description: เฉพาะคำตอบของ lock (T4 ยอดที่ใช้ได้ตอนนี้)
          properties:
            availableSatang: { type: integer, format: int64 }
            heldSatang: { type: integer, format: int64 }
    DealSummary:
      type: object
      required: [id, refNo, state, projectName, unitNo, totalSatang, myRole, createdAt]
      properties:
        id: { type: string, format: uuid }
        refNo: { type: string }
        state: { $ref: "#/components/schemas/DealState" }
        projectName: { type: string }
        unitNo: { type: string }
        totalSatang: { type: integer, format: int64 }
        myRole: { type: string, enum: [LANDLORD, TENANT] }
        createdAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready] }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED, IDEMPOTENCY_KEY_REQUIRED, UNAUTHENTICATED, FORBIDDEN_ROLE, NOT_DEAL_PARTY,
                     NOT_FOUND, DEAL_STATE_CONFLICT, VERSION_MISMATCH, IDEMPOTENCY_CONFLICT, INVITE_EXPIRED,
                     INSUFFICIENT_BALANCE, RATE_LIMITED, INTERNAL, NOT_READY]
            message: { type: string, description: ข้อความภาษาไทยพร้อมแสดง }
            requestId: { type: string }
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
